<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizsquad — Главная</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trailer.css">
</head>
<body>
    <load src="blocks/header.html" />
    <load src="blocks/hero.html" />
    <load src="blocks/trailer.html" />
    <load src="blocks/projects.html" />
    <load src="blocks/feedback.html" />
    <load src="blocks/footer.html" />

    <script>
        /*true технические работы включены false технические работы выключены*/
        const isMaintenanceMode = true; 
        if (isMaintenanceMode && !window.location.hostname.includes('localhost')) {
            window.location.href = 'maintenance.html';
        }
    
        // Ищем все кнопки открытия модалок
        const openButtons = document.querySelectorAll('.open-modal-btn');
        
        openButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.getAttribute('data-modal');
                const targetModal = document.getElementById(modalId);
                if (targetModal) {
                    targetModal.style.display = 'flex'; // Показываем окно
                    document.body.style.overflow = 'hidden'; // Запрещаем скролл сайта на фоне
                }
            });
        });

        // Находим все кнопки закрытия и оверлеи, чтобы прятать окно обратно
        const modals = document.querySelectorAll('.portfolio-modal');
        modals.forEach(modal => {
            const closeBtn = modal.querySelector('.modal-close-btn');
            const overlay = modal.querySelector('.modal-overlay');
            
            const closeModal = () => {
                modal.style.display = 'none';
                document.body.style.overflow = ''; // Возвращаем скролл сайту
            };

            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (overlay) overlay.addEventListener('click', closeModal); // Закрыть при клике мимо окна
        });
    </script>

     
</body>
</html>
