<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizsquad — Портфолио</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/7J3mrhsk/1.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portfolio.css">
    - Должно быть на каждой из 3 страниц!
</head>

</head>
<body>

    <!-- Подключаем блоки сайта -->
    <load src="blocks/header.html" />
    <load src="blocks/portfolio-cases.html" />
    <load src="blocks/feedback.html" />
    <load src="blocks/footer.html" />

    <!-- СКРИПТ ОЖИВЛЕНИЯ ПЛАШКИ (Строго перед закрытием body!) -->
    <script>
        // 1. Ищем кнопку с классом .open-modal-btn
        const openBtn = document.querySelector('.open-modal-btn');
        
        // 2. Ищем саму плашку по её ID
        const modal = document.getElementById('modal-case-1');
        
        // 3. Ищем крестик закрытия внутри плашки
        const closeBtn = document.querySelector('.modal-close-btn');
        const overlay = document.querySelector('.modal-overlay');

        // Если кнопка и плашка существуют на странице — включаем логику:
        if (openBtn && modal) {
            // При клике на кнопку «Подробнее» — показываем плашку (flex) [index]
            openBtn.addEventListener('click', () => {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Замораживаем скролл сайта сзади
            });
        }

        // Функция, которая прячет плашку обратно (none)
        const closeModal = () => {
            modal.style.display = 'none';
            document.body.style.overflow = ''; // Возвращаем скролл сайту
        };

        // Закрываем при клике на крестик или на темный фон рядом с плашкой
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (overlay) overlay.addEventListener('click', closeModal);
    </script>

</body>
</html>
